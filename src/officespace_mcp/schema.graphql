"""Wire-format error code for booking validation rejections."""
enum BookingErrorCode {
  """
  The booking request has already been approved (concurrent approval race).
  """
  alreadyApproved

  """The booking request has already been declined."""
  alreadyDeclined

  """
  The booking has already been canceled or checked out and cannot be ended again.
  """
  alreadyEnded

  """
  The requested check-in is earlier than the site self-service cut-off window allows.
  """
  beforeCutOffTime

  """
  The booking is being submitted outside the site’s configured operating hours.
  """
  bookingCreationOutsideOperatingHours

  """
  An active (currently checked-in) booking cannot be canceled — use check-out instead.
  """
  cannotCancelActiveBooking

  """The booking is in a state that does not permit editing."""
  cannotEdit

  """
  The check-in requirement cannot be waived when presence is required for this booking.
  """
  cannotWaivePresenceRequired

  """The requested check-in time is after the requested check-out time."""
  checkInAfterCheckOut

  """The requested check-out time is in the past."""
  checkOutTimeInPast

  """No employee record was found for the supplied delegate id."""
  delegateNotFound

  """
  The desk has already reached its per-day booking limit for the selected date.
  """
  deskDailyLimit

  """
  Desk lending is restricted to employees in the same department as the assigned occupant.
  """
  deskLendingRestrictedToDepartment

  """Desk lending is restricted to members of the assigned neighborhood."""
  deskLendingRestrictedToNeighborhood

  """The desk is unavailable for the visitor on the selected dates."""
  deskUnavailableForVisitor

  """
  The employee already has an overlapping desk booking — only one booking is allowed at a time.
  """
  employeeAlreadySeated

  """The employee is inactive and cannot be booked for a desk."""
  employeeIsInactive

  """The floor has reached its occupancy limit for the requested period."""
  floorAtCapacity

  """
  The requested check-in date is invalid — typically too far in the past for the site.
  """
  invalidCheckIn

  """The desk-lending period is outside the allowed range for the desk."""
  invalidDeskLendingPeriod

  """
  The requested check-in date is beyond the desk’s advance booking limit.
  """
  invalidPeriod

  """The desk is missing one or more of the requested features."""
  missingFeatures

  """
  The requested new period falls outside the period the request was approved for.
  """
  outOfApprovedPeriod

  """
  The requested period falls outside the site’s configured operating hours.
  """
  outsideOperatingHours

  """The booking cannot be checked in without a presence event."""
  presenceRequired

  """
  The employee must pass the site’s safeguard check before booking this desk.
  """
  safeguardCheckRequired

  """The specified seat does not exist (deleted or never created)."""
  seatDoesNotExist

  """
  The employee is not permitted to book this desk (group/department/neighborhood restriction).
  """
  seatForbidden

  """The desk is already booked for the requested period."""
  seatIsOccupied

  """The seat is no longer a bookable hot desk."""
  seatNotBookable

  """
  The requested period violates the desk’s availability restrictions (shift / season / availability rule).
  """
  seatRestricted

  """
  The desk has time-based booking restrictions and the requested check-in is before the occupant's advance-booking window opens.
  """
  timeRestricted

  """An unexpected error occurred while processing the booking."""
  unknownError

  """The visitor already has a desk booking for the requested period."""
  visitAlreadyInUse
}

