name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.18
      - run: uv sync --locked --python "${{ matrix.python-version }}"
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: uv build
      - name: Verify packaged schema
        run: |
          uv venv /tmp/wheel-smoke
          uv pip install --python /tmp/wheel-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/wheel-smoke/bin/python -c 'from officespace_mcp.api import API; from officespace_mcp.config import Settings; assert len(API(Settings()).schema.mutation_type.fields) == 54'
